# Railway Nixpacks configuration
[phases.build]
cmds = [
  "cargo build --release",
  "echo '=== Debug: Listing target/release/ ==='",
  "ls -la target/release/",
  "echo '=== Debug: Looking for binaries ==='", 
  "find target/release/ -type f -executable -name '*' | head -10",
  "mkdir -p bin",
  "cp target/release/rarch bin/ || echo 'Failed to copy rarch'",
  "cp target/release/migrate bin/ || echo 'Failed to copy migrate'",
  "echo '=== Debug: Listing bin/ ==='",
  "ls -la bin/",
  "echo '=== Debug: Making executable ==='",
  "chmod +x bin/* || true"
]

[phases.start]
cmd = "./bin/rarch"

[variables]
RUST_LOG = "info"