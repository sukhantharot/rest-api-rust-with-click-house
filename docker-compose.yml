version: "3.8"

services:
  # Main REST API service
  rest-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server configuration
      - RUST_LOG=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000

      # Database configuration
      - CLICKHOUSE_URL=https://clickhouse:vOn8UIeaAdx3Rgz7wRYuMRlUiaHWBWhg@clickhouse-production-71f9.up.railway.app:443/railway
      - DATABASE_NAME=railway

      # JWT configuration
      - JWT_SECRET=your-super-secret-jwt-key-here-change-in-production
      - JWT_EXPIRATION_HOURS=24

      # Admin configuration
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123

      # CORS configuration
      - CORS_ALLOWED_ORIGINS=*

    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: Redis for caching (if needed in future)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - app-network
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data

  # Optional: Nginx reverse proxy (for production)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - rest-api
  #   networks:
  #     - app-network
  #   restart: unless-stopped

networks:
  app-network:
    driver: bridge
